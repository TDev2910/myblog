name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: true
                    MYSQL_DATABASE: myblog_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  extensions: mbstring, dom, fileinfo, mysql, gd, exif
                  coverage: none

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Copy .env
              run: cp .env.example .env

            - name: Install PHP dependencies
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Install Node dependencies
              run: npm ci

            - name: Generate app key
              run: php artisan key:generate

            - name: Build frontend
              run: npm run build

            - name: Run tests
              run: php artisan test
              env:
                  DB_CONNECTION: mysql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 3306
                  DB_DATABASE: myblog_test
                  DB_USERNAME: root
                  DB_PASSWORD: ''

    # Build 2 image (app: nginx+php-fpm, ssr: node) từ 2 target khác nhau của
    # cùng Dockerfile, push lên GHCR — chỉ khi test đã pass VÀ đang ở nhánh
    # main (không chạy cho PR, tránh push image cho code chưa merge).
    build-and-push:
        needs: test
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            matrix:
                target: [app, ssr]
        steps:
            - uses: actions/checkout@v4

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Compute image tag suffix
              id: suffix
              run: |
                  if [ "${{ matrix.target }}" = "ssr" ]; then
                    echo "suffix=-ssr" >> "$GITHUB_OUTPUT"
                  else
                    echo "suffix=" >> "$GITHUB_OUTPUT"
                  fi

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/php/Dockerfile
                  target: ${{ matrix.target }}
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository }}:latest${{ steps.suffix.outputs.suffix }}
                      ghcr.io/${{ github.repository }}:${{ github.sha }}${{ steps.suffix.outputs.suffix }}
                  cache-from: type=gha,scope=${{ matrix.target }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.target }}

    # Deploy: SSH vào VPS, kéo image mới nhất, chạy release (migrate+cache),
    # rồi up lại các service. Cần 4 secret trong Settings > Secrets > Actions:
    # DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH (thư mục chứa
    # docker-compose.yml + .env trên VPS — xem deploy/README.md).
    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: Deploy over SSH
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.DEPLOY_HOST }}
                  username: ${{ secrets.DEPLOY_USER }}
                  key: ${{ secrets.DEPLOY_SSH_KEY }}
                  script: |
                      set -e
                      cd "${{ secrets.DEPLOY_PATH }}"
                      export TAG=${{ github.sha }}
                      docker compose pull app ssr
                      docker compose run --rm release
                      docker compose up -d --remove-orphans
                      docker image prune -f
