[supervisord]
nodaemon=true
; Không set user= ở đây: container đã chạy bằng non-root "nginx" ngay từ
; Dockerfile (USER nginx trước CMD) — supervisord tự thừa hưởng, không cần
; (và không thể, vì không phải root) tự setuid xuống user khác.
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:nginx]
; Ghi đè pid path sang /tmp: mặc định /run/nginx.pid có thể không ghi được
; bởi user non-root "nginx" tuỳ quyền của /run lúc container khởi động.
command=nginx -g "daemon off; pid /tmp/nginx.pid;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
