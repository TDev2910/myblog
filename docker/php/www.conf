[www]
; Không set user/group: cả container (nginx lẫn php-fpm) đã chạy bằng user
; non-root "nginx" ngay từ Dockerfile (USER nginx), nên set ở đây chỉ sinh
; NOTICE "'user' directive is ignored when FPM is not running as root". Cả 2
; tiến trình đã cùng 1 UID "nginx" (100) sẵn -> cùng quyền đọc/ghi
; storage/, bootstrap/cache, không có vấn đề permission giữa chúng.
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

clear_env = no
