# Bản rút gọn từ nginx.conf mặc định của gói alpine "nginx" — chỉ bỏ dòng
# "user nginx;" (container đã chạy non-root ngay từ USER trong Dockerfile,
# giữ dòng đó lại chỉ sinh ra warning "makes sense only if... super-user").
worker_processes auto;
pcre_jit on;
error_log /var/log/nginx/error.log warn;

include /etc/nginx/modules/*.conf;
include /etc/nginx/conf.d/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    client_max_body_size 1m;

    sendfile on;
    tcp_nopush on;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
            '$status $body_bytes_sent "$http_referer" '
            '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    include /etc/nginx/http.d/*.conf;
}
