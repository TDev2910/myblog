# nginx và php-fpm chạy trong cùng container (xem docker/php/Dockerfile),
# nên fastcgi_pass trỏ 127.0.0.1. Container này chỉ nghe HTTP thuần, cổng 80
# được compose map ra 127.0.0.1:8080 trên VPS — TLS/HTTPS do nginx cài thẳng
# trên VPS (ngoài Docker) đảm nhiệm, reverse-proxy vào cổng đó. Xem
# deploy/README.md mục "TLS". Lý do không tự cấp cert trong container:
# certbot cần ghi vào /etc/letsencrypt bền vững qua các lần renew, làm trong
# compose sẽ phức tạp hơn hẳn so với 1 nginx + certbot có sẵn trên host.
server {
    # 8080 (không phải 80): container chạy non-root (xem docker/php/Dockerfile),
    # bind cổng <1024 cần CAP_NET_BIND_SERVICE mà user thường không có.
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 12M;
    charset utf-8;

    # nginx trong container không thấy IP thật của khách -> lấy lại từ header
    # mà nginx-host (bên ngoài, reverse-proxy vào đây) đã set.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(css|js|woff2?|svg|png|jpe?g|webp|gif)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
