[program:myblog-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/myblog/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/myblog
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/myblog/storage/logs/queue-worker.log
stopwaitsecs=3600
