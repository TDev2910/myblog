server {
    listen 80;
    server_name myblog.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name myblog.example.com;
    root /var/www/myblog/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/myblog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myblog.example.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 12M;

    charset utf-8;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm-myblog.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(css|js|woff2?|svg|png|jpe?g|webp|gif)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
