[myblog]
user = www-data
group = www-data

listen = /run/php/php8.2-fpm-myblog.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

php_admin_value[error_log] = /var/www/myblog/storage/logs/php-fpm-error.log
php_admin_flag[log_errors] = on
php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 12M
